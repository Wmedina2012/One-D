
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>ONE D | DJ Mixes</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 18px;
      background: #000;
      color: #f5f5f5;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
      padding: 30px 24px;
      background: #090909;
      border-radius: 28px;
      animation: appear 0.8s ease both;
    }

    .logo {
      width: 145px;
      height: 82px;
      margin: 0 auto 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #292929;
      border-radius: 25px;
      background: #141414;
      color: #ed2637;
    }

    .logo svg {
      width: 48px;
      height: 48px;
      fill: none;
      stroke: currentColor;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      transition: transform 0.35s ease;
    }

    .logo:hover svg {
      transform: rotate(25deg);
    }

    h1 {
      font-size: clamp(36px, 8vw, 46px);
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }

    .subtitle {
      color: #8d8d8d;
      font-size: clamp(14px, 3.5vw, 19px);
      letter-spacing: 1px;
      margin-bottom: 28px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .button {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 68px;
      padding: 16px 12px;
      border: 2px solid #292929;
      border-radius: 18px;
      background: #141414;
      color: #f5f5f5;
      text-decoration: none;
      font-size: clamp(16px, 4vw, 21px);
      font-weight: 400;

      transition:
        transform 0.25s ease,
        background 0.25s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .button.primary {
      background: #ed2637;
      border-color: #ed2637;
      color: #fff;
    }

    /* Efecto al pasar el puntero */
    .button:hover {
      transform: translateY(-3px);
      background: #202020;
      border-color: #ed2637;
      box-shadow: 0 8px 20px rgba(237, 38, 55, 0.13);
    }

    .button.primary:hover {
      background: #ff3546;
      border-color: #ff3546;
      box-shadow: 0 8px 24px rgba(237, 38, 55, 0.3);
    }

    /* Efecto al pulsar */
    .button:active {
      transform: scale(0.97);
    }

    .button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    footer {
      margin-top: 26px;
      color: #666;
      font-size: 16px;
      letter-spacing: 1px;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(18px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 400px) {
      .container {
        padding: 26px 16px;
      }

      .button {
        min-height: 60px;
        border-radius: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- Logo de vinilo en SVG -->
    <div class="logo" aria-label="ONE D logo">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <circle cx="24" cy="24" r="19"/>
        <circle cx="24" cy="24" r="5"/>
        <path d="M12 18a13 13 0 0 0 0 12"/>
        <path d="M36 18a13 13 0 0 1 0 12"/>
      </svg>
    </div>

    <h1>ONE D</h1>
    <p class="subtitle">DJ · OPEN FORMAT · DJ MIXES</p>

    <nav class="links" aria-label="Enlaces de ONE D">

      <a class="button primary"
         href="https://www.youtube.com/@Dj_One_D"
         target="_blank" rel="noopener noreferrer">
        YouTube · DJ Mixes
      </a>

      <a class="button"
         href="https://www.instagram.com/one.d12/"
         target="_blank" rel="noopener noreferrer">
        Instagram
      </a>

      <a class="button"
         href="https://wa.me/message/G32LS27GDNR6H1"
         target="_blank" rel="noopener noreferrer">
        Contrataciones · WhatsApp
      </a>

      <a class="button"
         href="https://mega.nz/folder/hVlHmSBL#156gmo85_8ATEjfGJHnQ-Q"
         target="_blank" rel="noopener noreferrer">
        Promo Assets
      </a>

    </nav>

    <footer>© ONE D · DJ</footer>

  </main>
</body>
</html>
